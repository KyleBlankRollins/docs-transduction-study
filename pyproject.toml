[project]
name = "docs-transduction-study"
version = "0.1.0"
description = "Reproducible tooling for the documentation transduction study."
readme = "README.md"
authors = [{ name = "Kyle Rollins", email = "kyleblankrollins@gmail.com" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "anthropic>=2.10.0,<3",
    "inspect-ai>=0.3.251",
    "playwright>=1.62.0",
]

[dependency-groups]
dev = ["mypy>=1.18.2", "pytest>=8.4.2", "ruff>=0.13.0"]

[project.scripts]
docs-transduction-study = "docs_transduction_study:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
